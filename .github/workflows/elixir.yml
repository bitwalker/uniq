name: elixir

on:
  push:
    branches: [main, release-next]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yml

  security:
    permissions:
      contents: read
    uses: $/.github/workflows/security.yml
